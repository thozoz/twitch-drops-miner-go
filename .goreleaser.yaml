version: 2
project_name: tdm

builds:
  - id: tdm
    main: ./cmd/tdm
    binary: tdm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X tdm/pkg/version.Version={{ .Version }}
      - -X tdm/pkg/version.Commit={{ .ShortCommit }}
      - -X tdm/pkg/version.Date={{ .Date }}

archives:
  - id: tdm-archive
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - NOTICE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
