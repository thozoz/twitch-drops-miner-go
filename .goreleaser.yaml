version: 2
project_name: tdm

builds:
  - id: tdm
    main: ./cmd/tdm
    binary: tdm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/thozoz/twitch-drops-miner-go/pkg/version.Version={{ .Version }}
      - -X github.com/thozoz/twitch-drops-miner-go/pkg/version.Commit={{ .ShortCommit }}
      - -X github.com/thozoz/twitch-drops-miner-go/pkg/version.Date={{ .Date }}

archives:
  - id: tdm-archive
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - NOTICE

dockers_v2:
  - id: tdm
    ids: [tdm]
    dockerfile: Dockerfile.goreleaser
    images:
      - ghcr.io/thozoz/tdm
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - "{{ .Major }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: tdm
      org.opencontainers.image.description: "Headless-first Twitch Drops Miner daemon"
      org.opencontainers.image.source: https://github.com/thozoz/twitch-drops-miner-go
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
    annotations:
      org.opencontainers.image.source: https://github.com/thozoz/twitch-drops-miner-go
      org.opencontainers.image.description: "Headless-first Twitch Drops Miner daemon"
      org.opencontainers.image.licenses: MIT
    sbom: false

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs'
      - '^test'
      - '^chore'
      - '^ci'
      - '^style'
      - '^refactor\(planning\)'
      - 'Merge pull request'
      - 'Merge branch'
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Bug fixes
      regexp: '^fix'
      order: 1
    - title: Other
      order: 999
