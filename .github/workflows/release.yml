name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  goreleaser:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@thozoz'

      # Trusted Publishing (OIDC) requires npm >= 11.5.1. Node 24 ships a newer npm,
      # but assert it so a runner regression fails here with a clear message instead
      # of surfacing as an opaque auth failure at publish time.
      - name: Verify npm supports trusted publishing
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          npm_version="$(npm --version)"
          echo "node $(node --version) / npm ${npm_version}"
          if [ "$(printf '%s\n11.5.1\n' "$npm_version" | sort -V | head -1)" != "11.5.1" ]; then
            echo "npm ${npm_version} is older than 11.5.1 — trusted publishing (OIDC) is unsupported" >&2
            exit 1
          fi

      - name: Prepare npm packages
        if: startsWith(github.ref, 'refs/tags/')
        run: VERSION="${GITHUB_REF_NAME#v}" node npm/scripts/prepare.js

      - name: Publish npm packages
        if: startsWith(github.ref, 'refs/tags/')
        run: node npm/scripts/publish.js
